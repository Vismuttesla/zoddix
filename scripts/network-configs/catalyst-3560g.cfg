! =====================================================================
! TAA project - Catalyst 3560G 48-port baseline configuration
! Target IOS  : 12.2(50)SE or newer (EEM 3.x, DHCP snooping, ARP insp.)
! Role        : Core L3 distribution / user-access switch (core-sw01)
! Management  : Vlan 99 (10.0.99.0/24)
! Author      : TAA / KXD migration team
! Notes       : Replace every <REPLACE_ME_*> placeholder before pushing.
!               Apply from console; do NOT push over a session that
!               relies on the very interface being reconfigured.
! =====================================================================

! ---------------------------------------------------------------------
! Global service hardening
! ---------------------------------------------------------------------
service password-encryption
service timestamps debug datetime msec localtime show-timezone
service timestamps log   datetime msec localtime show-timezone
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
no ip http server
no ip http secure-server
no ip source-route
no ip bootp server
no ip domain lookup
no cdp run
no service finger
no service config

! ---------------------------------------------------------------------
! Hostname / domain / clock
! ---------------------------------------------------------------------
hostname core-sw01
ip domain-name taa.local
clock timezone UZT 5 0

! ---------------------------------------------------------------------
! AAA - local fallback, single privileged automation user for TAA
! ---------------------------------------------------------------------
aaa new-model
aaa authentication login default local
aaa authentication enable default enable
aaa authorization exec default local
aaa authorization commands 15 default local none
aaa session-id common

enable secret 0 <REPLACE_ME_ENABLE_SECRET>

! Automation user used by TAA (netmiko / Ansible). Privilege 15.
username taa_auto privilege 15 secret 0 <REPLACE_ME_USER_PASS>

! ---------------------------------------------------------------------
! Crypto / SSH only (no telnet)
! ---------------------------------------------------------------------
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3

! ---------------------------------------------------------------------
! VLAN database
! ---------------------------------------------------------------------
vlan 10
 name SERVERS
vlan 20
 name ADMIN
vlan 30
 name USERS
vlan 99
 name MGMT

! ---------------------------------------------------------------------
! L3 routing on
! ---------------------------------------------------------------------
ip routing
ip cef
ip subnet-zero
ip classless

! ---------------------------------------------------------------------
! Spanning-tree - Rapid-PVST, extended system-id, hardened defaults
! ---------------------------------------------------------------------
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree loopguard default
spanning-tree etherchannel guard misconfig
spanning-tree portfast bpduguard default
! Make this switch the root for all user/server VLANs
spanning-tree vlan 10,20,30,99 priority 8192

! ---------------------------------------------------------------------
! Errdisable - keep recovery automatic so a transient violation
! does not require a truck-roll; TAA will still be notified.
! ---------------------------------------------------------------------
errdisable recovery cause psecure-violation
errdisable recovery cause bpduguard
errdisable recovery cause storm-control
errdisable recovery cause arp-inspection
errdisable recovery cause dhcp-rate-limit
errdisable recovery cause link-flap
errdisable recovery interval 600

! ---------------------------------------------------------------------
! DHCP snooping (P1) - protect user / server / admin VLANs
! ---------------------------------------------------------------------
ip dhcp snooping
ip dhcp snooping vlan 10,20,30
no ip dhcp snooping information option
ip dhcp snooping database flash:/dhcp-snooping.db
ip dhcp snooping database write-delay 30

! ---------------------------------------------------------------------
! Dynamic ARP Inspection (P1) - paired with DHCP snooping
! ---------------------------------------------------------------------
ip arp inspection vlan 10,20,30
ip arp inspection validate src-mac dst-mac ip

! ---------------------------------------------------------------------
! MAC address-table notification (P5 - feeds TAA inventory)
! ---------------------------------------------------------------------
mac address-table notification change interval 5 history-size 50
mac address-table notification mac-move
mac address-table aging-time 300

! ---------------------------------------------------------------------
! SVIs - one /24 per VLAN, switch is the default-gateway
! ---------------------------------------------------------------------
interface Vlan10
 description SVI SERVERS
 ip address 10.0.10.1 255.255.255.0
 no shutdown
!
interface Vlan20
 description SVI ADMIN
 ip address 10.0.20.1 255.255.255.0
 no shutdown
!
interface Vlan30
 description SVI USERS
 ip address 10.0.30.1 255.255.255.0
 no shutdown
!
interface Vlan99
 description SVI MGMT (in-band management for TAA)
 ip address 10.0.99.2 255.255.255.0
 no shutdown

! ---------------------------------------------------------------------
! Port templates - defined as actual interface config blocks below
! ---------------------------------------------------------------------

! Gi0/1 - Server port (TAA / DL-160 lives here)
interface GigabitEthernet0/1
 description SERVER TAA/DL-160 (10.0.10.10)
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 switchport port-security aging time 0
 spanning-tree portfast
 spanning-tree bpduguard enable
 storm-control broadcast level 5.00
 storm-control multicast level 5.00
 storm-control action shutdown
 ip dhcp snooping limit rate 50
 no shutdown

! Gi0/2 - Gi0/24 : end-user access ports (VLAN 30 by default).
! NOTE: 'interface range' is intentionally NOT used so that each
! port keeps an individual description for inventory parsing.
interface GigabitEthernet0/2
 description USER ACCESS PORT
 switchport mode access
 switchport access vlan 30
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 switchport port-security aging time 10
 switchport port-security aging type inactivity
 spanning-tree portfast
 spanning-tree bpduguard enable
 storm-control broadcast level 1.00
 storm-control multicast level 1.00
 storm-control action shutdown
 ip dhcp snooping limit rate 15
 ip arp inspection limit rate 15
 no shutdown
!
