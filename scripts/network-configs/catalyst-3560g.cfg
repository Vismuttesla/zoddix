! ---------------------------------------------------------------------
! Gi0/25 - Uplink to TP-Link TL-SF 1024D (unmanaged L1 segment)
! ---------------------------------------------------------------------
interface GigabitEthernet0/25
 description UPLINK_TP-LINK_1024D (unmanaged - high risk segment)
 switchport mode access
 switchport access vlan 30
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 24
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 switchport port-security aging time 30
 switchport port-security aging type inactivity
 spanning-tree portfast
 spanning-tree bpduguard enable
 storm-control broadcast level 1.00
 storm-control multicast level 1.00
 storm-control action shutdown
 ip dhcp snooping limit rate 60
 ip arp inspection limit rate 60
 no shutdown

! ---------------------------------------------------------------------
! Gi0/26 - Gi0/47 : reserve / disabled by default
! ---------------------------------------------------------------------
interface range GigabitEthernet0/26 - 47
 description UNUSED - SHUTDOWN
 switchport mode access
 switchport access vlan 999
 shutdown

! ---------------------------------------------------------------------
! Gi0/48 - Trunk to Cisco 1800 router (edge-rt01)
! ---------------------------------------------------------------------
interface GigabitEthernet0/48
 description TRUNK to edge-rt01 (Fa0/1)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,99
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
 spanning-tree guard root
 no shutdown

! ---------------------------------------------------------------------
! Default route to edge-rt01 (sub-interface .99 = MGMT)
! ---------------------------------------------------------------------
ip route 0.0.0.0 0.0.0.0 10.0.99.1

! ---------------------------------------------------------------------
! ACL: only TAA server and the MGMT subnet may touch the VTY
! ---------------------------------------------------------------------
ip access-list standard TAA_MGMT
 remark === TAA management plane access ===
 permit host 10.0.10.10
 permit 10.0.99.0 0.0.0.255
 deny   any log

! ---------------------------------------------------------------------
! Console / VTY lines
! ---------------------------------------------------------------------
line con 0
 exec-timeout 10 0
 logging synchronous
 login authentication default
!
line vty 0 4
 exec-timeout 10 0
 logging synchronous
 access-class TAA_MGMT in
 transport input ssh
 transport output none
 login authentication default
!
line vty 5 15
 exec-timeout 10 0
 access-class TAA_MGMT in
 transport input ssh
 transport output none
 login authentication default

! ---------------------------------------------------------------------
! Logging - everything goes to TAA (DL-160)
! ---------------------------------------------------------------------
logging buffered 65536 informational
logging trap informational
logging facility local6
logging source-interface Vlan99
logging host 10.0.10.10
service sequence-numbers

! ---------------------------------------------------------------------
! NTP - TAA server acts as the local stratum source
! ---------------------------------------------------------------------
ntp server 10.0.10.10 prefer
ntp source Vlan99

! ---------------------------------------------------------------------
! SNMPv3 - read-only, SHA auth + AES128 priv. View limits OIDs the
! TAA poller can pull.
! ---------------------------------------------------------------------
snmp-server view TAA_RO iso included
snmp-server view TAA_RO internet included
snmp-server group TAA_GRP v3 priv read TAA_RO access TAA_MGMT
snmp-server user  taa_user TAA_GRP v3 auth sha <REPLACE_ME_AUTH_PASS> priv aes 128 <REPLACE_ME_PRIV_PASS> access TAA_MGMT
snmp-server contact TAA NOC <noc@taa.local>
snmp-server location core-sw01 / TAA-DC
snmp-server source-interface traps Vlan99

! Trap destination (TAA receiver)
snmp-server host 10.0.10.10 version 3 priv taa_user udp-port 162

! Trap categories required for the KXD use-cases (P1..P4)
snmp-server enable traps port-security trap-rate 5
snmp-server enable traps mac-notification change move threshold
snmp-server enable traps bridge newroot topologychange
snmp-server enable traps stpx inconsistency root-inconsistency loop-inconsistency
snmp-server enable traps storm-control trap-rate 10
snmp-server enable traps snmp linkdown linkup coldstart warmstart authentication
snmp-server enable traps config
snmp-server enable traps config-copy
snmp-server enable traps cpu threshold
snmp-server enable traps entity
snmp-server enable traps syslog

! CPU threshold to fire the trap above (kept conservative)
process cpu threshold type total rising 85 interval 30 falling 60 interval 30

! ---------------------------------------------------------------------
! EEM applets are stored as separate files under eem-applets/.
! Paste them in 'configure terminal' mode after this baseline is up.
! ---------------------------------------------------------------------

! ---------------------------------------------------------------------
! Banner
! ---------------------------------------------------------------------
banner motd ^C
================================================================
  AUTHORIZED ACCESS ONLY - TAA core-sw01 (Catalyst 3560G)
  All activity is logged and reported to the TAA NOC.
  Disconnect immediately if you are not an authorized user.
================================================================
^C

end
