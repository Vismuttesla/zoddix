! =====================================================================
! TAA project - Cisco 1800 series edge / WAN router baseline
! Target IOS  : 12.4(15)T or newer (EEM 2.4 applet support)
! Role        : Internet edge, NAT, WAN ACL, DHCP relay, syslog/SNMP
!               feeder to the TAA server
! Hostname    : edge-rt01
! Author      : TAA / KXD migration team
! Notes       : Replace every <REPLACE_ME_*> placeholder before pushing.
!               The WAN IP block below is a placeholder - swap it with
!               the address actually delivered by the ISP.
! =====================================================================

! ---------------------------------------------------------------------
! Global service hardening
! ---------------------------------------------------------------------
service password-encryption
service timestamps debug datetime msec localtime show-timezone
service timestamps log   datetime msec localtime show-timezone
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
no service finger
no service config
no ip http server
no ip http secure-server
no ip source-route
no ip bootp server
no ip domain lookup
no ip gratuitous-arps
no cdp run

! ---------------------------------------------------------------------
! Hostname / domain / clock
! ---------------------------------------------------------------------
hostname edge-rt01
ip domain name taa.local
clock timezone UZT 5 0

! ---------------------------------------------------------------------
! AAA
! ---------------------------------------------------------------------
aaa new-model
aaa authentication login default local
aaa authentication enable default enable
aaa authorization exec default local
aaa authorization commands 15 default local none
aaa session-id common

enable secret 0 <REPLACE_ME_ENABLE_SECRET>

! Automation user reused from the switch (same identity, same password
! store on the TAA server side - keep them in sync).
username taa_auto privilege 15 secret 0 <REPLACE_ME_USER_PASS>

! ---------------------------------------------------------------------
! Crypto / SSH only
! ---------------------------------------------------------------------
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3

! ---------------------------------------------------------------------
! ACLs
! ---------------------------------------------------------------------

! VTY access - TAA server + MGMT VLAN only
ip access-list standard VTY_ACL
 remark === Management plane (SSH) ===
 permit host 10.0.10.10
 permit 10.0.99.0 0.0.0.255
 deny   any log

! SNMP source restriction - only the TAA server may poll
ip access-list standard SNMP_RO
 remark === SNMP read-only allow-list ===
 permit host 10.0.10.10
 deny   any log

! WAN ingress filter - anti-spoof, RFC1918 drop, well-known scan ports
ip access-list extended WAN_IN
 remark === Anti-spoofing: block our own subnets coming from outside ===
 deny   ip 10.0.0.0    0.255.255.255   any log
 deny   ip 172.16.0.0  0.15.255.255    any log
 deny   ip 192.168.0.0 0.0.255.255     any log
 deny   ip 127.0.0.0   0.255.255.255   any log
 deny   ip 169.254.0.0 0.0.255.255     any log
 deny   ip 224.0.0.0   15.255.255.255  any log
 deny   ip host 0.0.0.0                any log
 remark === Drop loud scan/exploit destinations on the public side ===
 deny   tcp any any eq 23   log
 deny   tcp any any eq 135  log
 deny   tcp any any eq 139  log
 deny   tcp any any eq 445  log
 deny   tcp any any eq 1433 log
 deny   tcp any any eq 3389 log
 deny   udp any any eq 137  log
 deny   udp any any eq 138  log
 deny   udp any any eq 1434 log
 remark === Allow ICMP echo-reply for our own outbound pings ===
 permit icmp any any echo-reply
 permit icmp any any time-exceeded
 permit icmp any any packet-too-big
 permit icmp any any unreachable
 remark === Allow established/stateful return traffic ===
 permit tcp any any established
 permit udp any any gt 1023
 remark === Default ===
 deny   ip any any log

! LAN ingress filter - simple permit; the heavy lifting is on 3560G
ip access-list extended LAN_IN
 remark === Trust LAN, block management plane from USER VLAN ===
 deny   ip 10.0.30.0 0.0.0.255 host 10.0.99.1 log
 deny   tcp 10.0.30.0 0.0.0.255 any eq 22 log
 permit ip any any

! NAT ACL - what is allowed to be translated to the WAN
ip access-list extended NAT_ACL
 remark === Translate user / admin / server VLANs to the WAN IP ===
 permit ip 10.0.10.0 0.0.0.255 any
 permit ip 10.0.20.0 0.0.0.255 any
 permit ip 10.0.30.0 0.0.0.255 any
 deny   ip any any

! ---------------------------------------------------------------------
! Interfaces
! ---------------------------------------------------------------------

! FastEthernet0/0 - WAN
interface FastEthernet0/0
 description WAN to ISP (replace IP with the value provided by the ISP)
 ip address 203.0.113.2 255.255.255.252
 ip access-group WAN_IN in
 ip nat outside
 ip virtual-reassembly
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no cdp enable
 duplex auto
 speed auto
 no shutdown

! FastEthernet0/1 - LAN trunk to core-sw01 (Gi0/48)
interface FastEthernet0/1
 description LAN trunk to core-sw01 Gi0/48 (dot1q)
 no ip address
 duplex auto
 speed auto
 no shutdown

! Sub-interface for SERVERS VLAN 10
interface FastEthernet0/1.10
 description SERVERS VLAN 10
 encapsulation dot1Q 10
 ip address 10.0.10.254 255.255.255.0
 ip access-group LAN_IN in
 ip nat inside
 ip virtual-reassembly
 no ip redirects
 no ip proxy-arp

! Sub-interface for ADMIN VLAN 20
interface FastEthernet0/1.20
 description ADMIN VLAN 20
 encapsulation dot1Q 20
 ip address 10.0.20.254 255.255.255.0
 ip access-group LAN_IN in
 ip nat inside
 ip virtual-reassembly
 no ip redirects
 no ip proxy-arp

! Sub-interface for USERS VLAN 30
interface FastEthernet0/1.30
 description USERS VLAN 30
 encapsulation dot1Q 30
 ip address 10.0.30.254 255.255.255.0
 ip access-group LAN_IN in
 ip nat inside
 ip virtual-reassembly
 no ip redirects
 no ip proxy-arp

! Sub-interface for MGMT VLAN 99 (default route towards the switch)
interface FastEthernet0/1.99
 description MGMT VLAN 99
 encapsulation dot1Q 99
 ip address 10.0.99.1 255.255.255.0
 ip access-group LAN_IN in
 ip nat inside
 ip virtual-reassembly
 no ip redirects
 no ip proxy-arp

! ---------------------------------------------------------------------
! Routing
! ---------------------------------------------------------------------
ip cef
ip classless
ip route 0.0.0.0 0.0.0.0 203.0.113.1 name DEFAULT_TO_ISP
! Reach the SVI subnets via the switch
ip route 10.0.10.0 255.255.255.0 10.0.99.2
ip route 10.0.20.0 255.255.255.0 10.0.99.2
ip route 10.0.30.0 255.255.255.0 10.0.99.2

! ---------------------------------------------------------------------
! NAT (PAT) - overload the WAN interface
! ---------------------------------------------------------------------
ip nat inside source list NAT_ACL interface FastEthernet0/0 overload
ip nat translation timeout      86400
ip nat translation tcp-timeout  86400
ip nat translation udp-timeout  300
ip nat translation icmp-timeout 60

! ---------------------------------------------------------------------
! DHCP relay-only on this router (the switch / TAA handle lease pool).
! If you want the router itself to lease, uncomment the pool block.
! ---------------------------------------------------------------------
ip dhcp excluded-address 10.0.10.1 10.0.10.20
ip dhcp excluded-address 10.0.20.1 10.0.20.20
ip dhcp excluded-address 10.0.30.1 10.0.30.20
ip dhcp excluded-address 10.0.99.1 10.0.99.20

! ip dhcp pool USERS
!  network 10.0.30.0 255.255.255.0
!  default-router 10.0.30.1
!  dns-server 10.0.10.10 8.8.8.8
!  lease 0 8

! ---------------------------------------------------------------------
! VTY / console
! ---------------------------------------------------------------------
line con 0
 exec-timeout 10 0
 logging synchronous
 login authentication default
!
line vty 0 4
 exec-timeout 10 0
 logging synchronous
 access-class VTY_ACL in
 transport input ssh
 transport output none
 login authentication default
!
line vty 5 15
 exec-timeout 10 0
 access-class VTY_ACL in
 transport input ssh
 transport output none
 login authentication default

! ---------------------------------------------------------------------
! Logging towards the TAA server
! ---------------------------------------------------------------------
logging buffered 65536 informational
logging trap informational
logging facility local6
logging source-interface FastEthernet0/1.99
logging host 10.0.10.10
service sequence-numbers

! ---------------------------------------------------------------------
! NTP - act as master so the rest of the LAN can fall back to us
! while the TAA server is the preferred upstream.
! ---------------------------------------------------------------------
ntp master 5
ntp server 10.0.10.10 prefer
ntp source FastEthernet0/1.99
ntp access-group peer SNMP_RO

! ---------------------------------------------------------------------
! SNMPv3 - identical group/user/view layout to the 3560G
! ---------------------------------------------------------------------
snmp-server view TAA_RO iso included
snmp-server view TAA_RO internet included
snmp-server group TAA_GRP v3 priv read TAA_RO access SNMP_RO
snmp-server user  taa_user TAA_GRP v3 auth sha <REPLACE_ME_AUTH_PASS> priv aes 128 <REPLACE_ME_PRIV_PASS> access SNMP_RO
snmp-server contact TAA NOC <noc@taa.local>
snmp-server location edge-rt01 / TAA-DC
snmp-server source-interface traps FastEthernet0/1.99

snmp-server host 10.0.10.10 version 3 priv taa_user udp-port 162

snmp-server enable traps snmp linkdown linkup coldstart warmstart authentication
snmp-server enable traps config
snmp-server enable traps config-copy
snmp-server enable traps cpu threshold
snmp-server enable traps entity
snmp-server enable traps syslog

process cpu threshold type total rising 85 interval 30 falling 60 interval 30

! ---------------------------------------------------------------------
! Banner
! ---------------------------------------------------------------------
banner motd ^C
================================================================
  AUTHORIZED ACCESS ONLY - TAA edge-rt01 (Cisco 1800)
  All activity is logged and reported to the TAA NOC.
  Disconnect immediately if you are not an authorized user.
================================================================
^C

end
