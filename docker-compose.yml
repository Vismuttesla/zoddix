services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./taa_database_backup_utf8.sql:/docker-entrypoint-initdb.d/01-restore.sql
      - ./02-rebrand-taa.sql:/docker-entrypoint-initdb.d/02-rebrand-taa.sql
    networks:
      - zabbix-network

  taa-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: taa-server
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
      ZBX_STARTPOLLERS: "5"
      ZBX_STARTPOLLERSUNREACHABLE: "1"
      ZBX_STARTTRAPPERS: "5"
      ZBX_STARTPINGERS: "1"
      ZBX_STARTDISCOVERERS: "1"
    ports:
      - "10051:10051"
    depends_on:
      - postgres
    networks:
      - zabbix-network

  # TAA Agent2 - Monitoring agent
  taa-agent:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: taa-agent
    environment:
      ZBX_HOSTNAME: "TAA serveri"
      ZBX_SERVER_HOST: "taa-server"
      ZBX_SERVER_PORT: "10051"
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_DEBUGLEVEL: "3"
      ZBX_TIMEOUT: "30"
      ZBX_ENABLEREMOTECOMMANDS: "1"
      ZBX_LOGREMOTECOMMANDS: "1"
    ports:
      - "10050:10050"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - taa-server
    networks:
      - zabbix-network
    privileged: true
    restart: unless-stopped

  # Ikkinchi TAA Agent - Boshqa server yoki resurs uchun
  taa-agent-2:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: taa-agent-2
    environment:
      ZBX_HOSTNAME: "Ikkinchi Server"
      ZBX_SERVER_HOST: "taa-server"
      ZBX_SERVER_PORT: "10051"
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_DEBUGLEVEL: "3"
    ports:
      - "10052:10050"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    depends_on:
      - taa-server
    networks:
      - zabbix-network
    restart: unless-stopped

  taa-web:
    image: taa-web:custom
    build:
      context: .
    container_name: taa-web
    environment:
      ZBX_SERVER_NAME: "TAA Monitor Tizimi"
      ZBX_DEFAULT_LANG: "uz_UZ"
      ZBX_SERVER_HOST: taa-server
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
      # PHP-FPM uchun:
      PHP_FPM_PM: "dynamic"
      PHP_FPM_PM_MAX_CHILDREN: "50"
      PHP_FPM_PM_START_SERVERS: "5"
      PHP_FPM_PM_MIN_SPARE_SERVERS: "5"
      PHP_FPM_PM_MAX_SPARE_SERVERS: "35"
      PHP_FPM_PM_MAX_REQUESTS: "0"
      # TAA uchun:
      ZBX_MAXEXECUTIONTIME: "300"
      ZBX_MEMORYLIMIT: "128M"
      ZBX_POSTMAXSIZE: "16M"
      ZBX_UPLOADMAXFILESIZE: "2M"
      ZBX_MAXINPUTTIME: "300"
      PHP_TZ: "Asia/Tashkent"
      EXPOSE_WEB_SERVER_INFO: "false"

    ports:
      - "8098:8080"
    depends_on:
      - taa-server
      - postgres
      - taa-agent
    volumes:
#      - ./ui/locale/uz_UZ:/usr/share/zabbix/locale/uz_UZ:ro
      - ./ui/conf/zabbix.conf.php:/etc/zabbix/conf/zabbix.conf.php:ro
      - ./ui/include/locales.inc.php:/usr/share/zabbix/include/locales.inc.php:ro
#      - ./ui/locale/uz/LC_MESSAGES/frontend.mo:/usr/share/zabbix/locale/uz/LC_MESSAGES/frontend.mo:ro
      - ./css:/usr/share/zabbix/css:ro
      - ./sass:/usr/share/zabbix/sass:ro
      - ./misc:/usr/share/zabbix/misc:ro
      - ./templates:/usr/share/zabbix/templates:ro
    networks:
      - zabbix-network

volumes:
  postgres-data:

networks:
  zabbix-network:
    driver: bridge
