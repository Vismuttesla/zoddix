version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - zabbix-network

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
    depends_on:
      - postgres
    networks:
      - zabbix-network

  zabbix-web:
    image: zoddix-web:custom
    build:
      context: .
    container_name: zabbix-web
    environment:
      ZBX_SERVER_NAME: "TAA Monitor Tizimi"
      ZBX_DEFAULT_LANG: "uz_UZ"
      ZBX_SERVER_HOST: TAA-server
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_password
      POSTGRES_DB: zabbix
      # PHP-FPM uchun:
      PHP_FPM_PM: "dynamic"
      PHP_FPM_PM_MAX_CHILDREN: "50"
      PHP_FPM_PM_START_SERVERS: "5"
      PHP_FPM_PM_MIN_SPARE_SERVERS: "5"
      PHP_FPM_PM_MAX_SPARE_SERVERS: "35"
      PHP_FPM_PM_MAX_REQUESTS: "0"
      # TAA uchun:
      ZBX_MAXEXECUTIONTIME: "300"
      ZBX_MEMORYLIMIT: "128M"
      ZBX_POSTMAXSIZE: "16M"
      ZBX_UPLOADMAXFILESIZE: "2M"
      ZBX_MAXINPUTTIME: "300"
      PHP_TZ: "Asia/Tashkent"
      EXPOSE_WEB_SERVER_INFO: "false"

    ports:
      - "8098:8080"
    depends_on:
      - zabbix-server
      - postgres
    volumes:
#      - ./ui/locale/uz_UZ:/usr/share/zabbix/locale/uz_UZ:ro
      - ./ui/conf/zabbix.conf.php:/etc/zabbix/conf/zabbix.conf.php:ro
      - ./ui/include/locales.inc.php:/usr/share/zabbix/include/locales.inc.php:ro
#      - ./ui/locale/uz/LC_MESSAGES/frontend.mo:/usr/share/zabbix/locale/uz/LC_MESSAGES/frontend.mo:ro
      - ./css:/usr/share/zabbix/css:ro
      - ./sass:/usr/share/zabbix/sass:ro
      - ./misc:/usr/share/zabbix/misc:ro
    networks:
      - zabbix-network

volumes:
  postgres-data:

networks:
  zabbix-network:
    driver: bridge
