# TAA Agent2 Configuration File
# Bu fayl TAA monitoring tizimi uchun agent2 konfiguratsiyasi

# =========================
# UMUMIY SOZLAMALAR
# =========================

# Agent daemon PID fayli
PidFile=/tmp/zabbix_agent2.pid

# Log fayli (Docker da console ga yoziladi)
LogType=console

# Debug darajasi (0-5, 3 - standart)
DebugLevel=3

# =========================
# SERVER ULANISHI
# =========================

# Zabbix Server manzili - passive checks uchun
# Docker network ichida container nomi ishlatiladi
Server=zabbix-server

# Zabbix Server manzili - active checks uchun
# Format: server:port
ServerActive=zabbix-server:10051

# =========================
# AGENT IDENTIFIKATSIYASI
# =========================

# Hostname - serverda ro'yxatdan o'tgan nom bilan bir xil bo'lishi SHART
# Bu nom Web UI da "TAA serveri" deb ko'rinadi
Hostname=TAA serveri

# Agar Hostname avtomatik aniqlansin:
# HostnameItem=system.hostname

# Host metadata - avtomatik ro'yxatdan o'tish uchun
# HostMetadata=Linux TAA-Agent

# =========================
# AGENT LISTENING
# =========================

# Agent tinglash porti (passive checks uchun)
ListenPort=10050

# Agent IP manzili (barcha interfeyslarni tinglash)
ListenIP=0.0.0.0

# =========================
# XAVFSIZLIK
# =========================

# Masofadan buyruq bajarishga ruxsat
EnableRemoteCommands=1

# Log masofaviy buyruqlarni
LogRemoteCommands=1

# =========================
# BUFFER SOZLAMALARI
# =========================

# Bufer hajmi (active checks uchun)
BufferSize=100

# Yuborish oralig'i (sekundda)
BufferSend=5

# =========================
# TIMEOUT SOZLAMALARI
# =========================

# Umumiy timeout (sekundda)
Timeout=30

# =========================
# PLUGINS (Agent2 uchun)
# =========================

# Plugin konfiguratsiya fayllari
# Include=/etc/zabbix/zabbix_agent2.d/plugins.d/*.conf

# =========================
# USER PARAMETERS (ixtiyoriy)
# =========================

# Maxsus parametrlar qo'shish mumkin:
# UserParameter=custom.metric,/path/to/script.sh

# =========================
# SYSTEM MONITORING
# =========================

# Tizim ma'lumotlarini yig'ish
# AllowKey=system.*
# AllowKey=vfs.*
# AllowKey=net.*
# AllowKey=proc.*

